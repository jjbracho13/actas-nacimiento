services:
  - type: web
    name: actas-nacimiento-api
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: cd backend && python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: actas-nacimiento-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://actas-nacimiento-api.onrender.com"]'
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  - name: actas-nacimiento-db
    plan: free
    database: actas_nacimiento
